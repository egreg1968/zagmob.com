<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open in Out Lived! — Shared from history</title>
  <meta name="description" content="Someone shared a historical figure from Out Lived! Open the app to see who — and discover who you've already outlived.">
  <meta name="robots" content="noindex">

  <!-- Static OG tags: Facebook crawler does not run JS. GitHub Pages serves this file for /p/* -->
  <meta property="og:title" content="Someone shared a figure from Out Lived!">
  <meta property="og:description" content="Open the app to see who from history — and discover who you've already outlived.">
  <meta property="og:image" content="https://zagmob.com/images/og_image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Out Lived!">
  <meta property="og:url" content="https://zagmob.com/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Someone shared a figure from Out Lived!">
  <meta name="twitter:description" content="Open the app to see who from history — and discover who you've already outlived.">
  <meta name="twitter:image" content="https://zagmob.com/images/og_image.png">
  <meta name="apple-itunes-app" content="app-id=6760954055">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <div id="deeplink-root"></div>
  <script src="/js/deeplink-landing.js"></script>
  <script>
    // GitHub Pages serves this file for missing paths but keeps the original URL
    // (e.g. /p/BASE64SLUG), which is what we need for deep link landings.
    DeeplinkLanding.init404('deeplink-root');
  </script>
</body>
</html>
